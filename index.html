<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PULSE · Move without limits</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#fff;--ink:#0B0B0B;--mute:#4A4F55;--line:#D1D5D8;--tile:#EBEBED;--btn:#0B0B0B;--btn-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0B0B0B;--surface:#151617;--ink:#fff;--mute:#A9AEB4;--line:#2A2D31;--btn:#fff;--btn-ink:#0B0B0B}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0B0B0B;--surface:#151617;--ink:#fff;--mute:#A9AEB4;--line:#2A2D31;--btn:#fff;--btn-ink:#0B0B0B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Montserrat,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid #8AA4FF;outline-offset:2px}
.logo{font:italic 900 30px/1 Montserrat,sans-serif;letter-spacing:-.04em;text-transform:uppercase}
.logo sup{font-size:9px;font-style:normal;font-weight:600;letter-spacing:0;vertical-align:top;margin-left:2px}
.ann{background:#0B0B0B;color:#fff;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;text-align:center;padding:10px 40px;position:relative}
.ann button{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px;color:#fff;line-height:1}
.ann.off{display:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:24px;padding:14px 32px}
nav{display:flex;gap:36px;justify-content:center}
nav button{font-weight:600;font-size:14px;text-transform:uppercase;padding:6px 0;border-bottom:2px solid transparent}
nav button[aria-pressed=true]{border-color:var(--ink)}
nav button.sale{color:var(--mute)}
.search{display:flex;align-items:center;gap:8px;background:var(--tile);border-radius:999px;padding:0 14px;color:#4A4F55;width:260px}
.search input{border:0;background:none;font:inherit;font-size:13px;padding:10px 0;width:100%;color:#0B0B0B;outline:0}
.search:focus-within{outline:3px solid #8AA4FF}
.icons{display:flex;gap:18px;align-items:center}
.cartbtn{position:relative}
.cartbtn b{position:absolute;top:-8px;right:-10px;background:#0B0B0B;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:grid;place-items:center;border:1px solid #fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cartbtn b{background:#fff;color:#0B0B0B;border-color:#0B0B0B}}

peat;color:#fff;min-height:400px;display:flex;flex-direction:column;justify-content:center;gap:26px;padding:48px 32px 48px clamp(24px,6vw,108px)}

.nm{display:block;margin-top:10px;font-weight:500;text-align:left}

.cu{color:var(--mute);font-size:12px}

.drawer.on{transform:none}

.x{font-size:28px;line-height:1}

.qty{display:flex;align-items:center;gap:10px;margin-top:6px}.qty button{width:26px;height:26px;border:1px solid var(--line);border-radius:3px}
.small{color:var(--mute);font-size:12px}

.full{width:100%}.ghost{border:1px solid var(--line);margin-top:8px;padding:12px;font-weight:600;font-size:13px;border-radius:3px;text-transform:uppercase}

.ok{text-align:center;padding:30px 6px}.ok h2{font-size:34px;margin-bottom:10px}

const TEE='<path d="M30 20 L12 32 L20 46 L30 40 V84 H70 V40 L80 46 L88 32 L70 20 Q50 34 30 20Z"/>';
const ICON={
 remera:TEE,
 top:'<path d="M32 14 H40 L44 40 H56 L60 14 H68 L76 52 Q76 62 70 66 V86 H30 V66 Q24 62 24 52Z"/>',
 shorts:'<path d="M24 24 H76 L84 78 H56 L50 50 L44 78 H16Z"/>',
 buzo:'<path d="M30 20 L12 34 L18 72 H30 V86 H70 V72 H82 L88 34 L70 20 Q50 40 30 20Z"/>',
 zapatillas:'<path d="M8 64 Q8 46 24 43 L38 40 L48 51 H66 Q92 53 92 67 V76 H8Z"/>',
 gorra:'<path d="M16 62 Q16 30 50 30 Q84 30 84 62Z"/><path d="M58 62 H96 V69 H58Z"/>',
 mochila:'<path d="M24 32 H76 V88 H24Z"/><path d="M34 32 Q34 12 50 12 Q66 12 66 32" fill="none" stroke="#0B0B0B" stroke-width="6"/>',
 medias:'<path d="M36 12 H64 V58 L84 72 V90 H48 L36 74Z"/>'
};
const LOGO={remera:[50,40],top:[50,50],buzo:[50,44],shorts:[68,42],gorra:[50,52],mochila:[50,60]};
const sil=t=>{const l=LOGO[t];return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#0B0B0B">${ICON[t]}</g>${l?`<text x="${l[0]}" y="${l[1]}" font-size="10" font-style="italic" font-weight="900" fill="#fff" text-anchor="middle" font-family="Montserrat,sans-serif">P</text>`:''}</svg>`};
const line=t=>`<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">${ICON[t]}</g></svg>`;
const pic=p=>p.i?(p.w?`<div class="wide" style="background:linear-gradient(${p.w})"><img src="${IMG[p.i]}" alt="${p.n}"></div>`:`<img src="${IMG[p.i]}" alt="${p.n}">`):sil(p.t);
const R=['S','M','L','XL'],ZH=['39','40','41','42','43','44','45'],ZM=['35','36','37','38','39','40'],U=['Único'];
const P=[
 {id:1,n:'Remera Performance',t:'remera',i:'a',p:34990,tg:['hombre'],s:R,bs:1},
 {id:2,n:'Short Deportivo Pro',t:'shorts',i:'b',p:29990,tg:['hombre','shorts'],s:R},
 {id:3,n:'Buzo Hoodie Essential',t:'buzo',i:'c',p:64990,tg:['hombre','mujer','buzos'],s:['S','M','L','XL','XXL']},
 {id:4,n:'Top Deportivo',t:'top',i:'d',p:32990,tg:['mujer'],s:['XS','S','M','L']},
 {id:5,n:'Short Running Liviano',t:'shorts',i:'e',p:26990,o:34990,tg:['hombre','shorts'],s:R},
 {id:6,n:'Campera Rompevientos',t:'buzo',i:'f',p:79990,tg:['hombre','mujer','buzos'],s:R},
 {id:7,n:'Pulse Runner Hombre',t:'zapatillas',i:'n',w:'#dedde0,#e1e0e3',p:119990,tg:['hombre','zapatillas'],s:ZH},
 {id:13,n:'Pulse Runner Mujer',t:'zapatillas',i:'o',w:'#dedde0,#e3e3e5',p:119990,tg:['mujer','zapatillas'],s:ZM},
 {id:8,n:'Remera Training Mujer',t:'remera',i:'m',p:31990,tg:['mujer'],s:['XS','S','M','L']},
 {id:9,n:'Gorra Pulse',t:'gorra',i:'g',p:14990,tg:['hombre','mujer','accesorios'],s:U},
 {id:10,n:'Mochila Training 25 L',t:'mochila',i:'k',p:44990,tg:['hombre','mujer','accesorios'],s:U},
 {id:11,n:'Medias Performance x3',t:'medias',i:'l',p:12990,o:15990,tg:['hombre','mujer','accesorios'],s:['35-38','39-42','43-46']},
 {id:12,n:'Gorra Snapback',t:'gorra',i:'h',p:17990,tg:['hombre','mujer','accesorios'],s:U}
];
const LBL={todo:'Más vendidos',hombre:'Hombre',mujer:'Mujer',shorts:'Shorts',buzos:'Buzos',zapatillas:'Zapatillas',accesorios:'Accesorios',sale:'Sale'};
const STRIP=[['hombre','remera'],['mujer','top'],['shorts','shorts'],['buzos','buzo'],['zapatillas','zapatillas'],['accesorios','gorra']];
let f='todo',q='',cart=[],favs=new Set();
try{cart=JSON.parse(localStorage.getItem('pulse-cart')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('pulse-cart',JSON.stringify(cart))}catch(e){}};
const heart=on=>`<svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20s-7-4.4-9-9a5 5 0 019-3 5 5 0 019 3c-2 4.600-9 9-9 9z"/></svg>`;

$('#strip').innerHTML=STRIP.map(([k,t])=>`<button data-f="${k}">${line(t)}${LBL[k]}</button>`).join('')+'<div class="pbox" aria-hidden="true">P</div>';
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===f));
  $('#ttl').textContent=q?`Resultados para “${q}”`:LBL[f];
  const t=q.trim().toLowerCase();
  const l=P.filter(p=>(f==='todo'||(f==='sale'?p.o:p.tg.includes(f)))&&(!t||p.n.toLowerCase().includes(t)));
  $('#grid').innerHTML=l.length?l.map(p=>`<article class="card"><button class="pic" data-id="${p.id}" aria-label="Ver ${p.n}">${p.bs?'<span class="tag">Best seller</span>':p.o?`<span class="tag">-${Math.round(100-p.p/p.o*100)}%</span>`:''}${pic(p)}</button><button class="fav" data-fav="${p.id}" aria-label="Favorito" aria-pressed="${favs.has(p.id)}">${heart(favs.has(p.id))}</button><button class="nm" data-id="${p.id}">${p.n}</button><div><span class="pr">${ARS(p.p)}</span>${p.o?`<span class="old">${ARS(p.o)}</span>`:''}</div><div class="cu">3 cuotas sin interés de ${ARS(Math.round(p.p/3))}</div></article>`).join(''):'<div class="empty">No encontramos productos con esa búsqueda. Probá con otra palabra o mirá todo el catálogo.</div>';
}
document.addEventListener('click',e=>{
  const fb=e.target.closest('[data-f]');
  if(fb){f=fb.dataset.f;q='';$('#q').value='';render();$('#catalogo').scrollIntoView({behavior:'smooth'});return}
  const fv=e.target.closest('[data-fav]');
  if(fv){const id=+fv.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);render();return}
  const pb=e.target.closest('#grid [data-id]');if(pb)product(+pb.dataset.id);
});
$('#q').oninput=e=>{q=e.target.value;render()};

function product(id){
  const p=P.find(x=>x.id===id);let sel=p.s.length===1?p.s[0]:null;const m=$('#modal');
  m.innerHTML=`<div class="box" role="dialog" aria-label="${p.n}"><div class="big">${pic(p)}</div><div class="info"><button class="x" style="justify-self:end" id="cl" aria-label="Cerrar">×</button><h2>${p.n}</h2><div><span class="pr" style="font-size:20px">${ARS(p.p)}</span>${p.o?`<span class="old">${ARS(p.o)}</span>`:''}<div class="cu">3 cuotas sin interés de ${ARS(Math.round(p.p/3))}</div></div><div><div class="small" style="margin-bottom:6px">${p.s.length===1?'Talle':'Elegí tu talle'}</div><div class="sizes">${p.s.map(z=>`<button aria-pressed="${z===sel}" data-z="${z}">${z}</button>`).join('')}</div></div><div class="err" id="er"></div><button class="cta" id="add">Agregar al carrito</button></div></div>`;
  m.classList.add('on');$('#ov').classList.add('on');
  m.onclick=e=>{
    if(e.target===m||e.target.id==='cl')return closeAll();
    const z=e.target.closest('[data-z]');
    if(z){sel=z.dataset.z;m.querySelectorAll('[data-z]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.z===sel));$('#er').textContent=''}
    if(e.target.id==='add'){if(!sel){$('#er').textContent='Elegí un talle para continuar.';return}
      const k=p.id+'|'+sel,x=cart.find(i=>i.k===k);x?x.q++:cart.push({k,id:p.id,z:sel,q:1});save();closeAll();drawer()}
  };
}
function closeAll(){$('#modal').classList.remove('on');$('#drawer').classList.remove('on');$('#ov').classList.remove('on')}
$('#ov').onclick=closeAll;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
$('#openCart').onclick=()=>drawer();
const total=()=>cart.reduce((s,i)=>s+P.find(p=>p.id===i.id).p*i.q,0);
function drawer(step){
  const d=$('#drawer'),t=total(),n=cart.reduce((s,i)=>s+i.q,0),FREE=80000;
  $('#count').textContent=n;d.classList.add('on');$('#ov').classList.add('on');$('#modal').classList.remove('on');
  const head=h=>`<h2>${h}<button class="x" data-a="close" aria-label="Cerrar">×</button></h2>`;
  if(step==='done'){d.innerHTML=head('Pedido')+`<div class="ok"><h2>¡Listo!</h2><p>Recibimos tu pedido y te enviamos la confirmación por email. Lo despachamos en 24 a 48 hs.</p><button class="cta full" data-a="close">Seguir comprando</button></div>`;return}
  if(step==='pay'){d.innerHTML=head('Tus datos')+`<div class="items"><div class="field"><label for="f1">Nombre y apellido</label><input id="f1" autocomplete="name"></div><div class="field"><label for="f2">Email</label><input id="f2" type="email" autocomplete="email"></div><div class="field"><label for="f3">Dirección de envío</label><input id="f3" autocomplete="street-address"></div><div class="field"><label for="f4">Forma de pago</label><select id="f4"><option>Tarjeta en 3 cuotas sin interés</option><option>Transferencia</option><option>Mercado Pago</option></select></div><div class="err" id="er"></div></div><div class="tot"><span>Total</span><span>${ARS(t)}</span></div><button class="cta full" data-a="confirm">Confirmar pedido</button><button class="ghost full" data-a="back">Volver al carrito</button>`;return}
  d.innerHTML=head('Carrito')+(n?`<div class="items">${cart.map((i,x)=>{const p=P.find(q=>q.id===i.id);return `<div class="row"><div class="th">${pic(p)}</div><div><b>${p.n}</b><div class="small">Talle ${i.z} · ${ARS(p.p)}</div><div class="qty"><button data-a="m" data-x="${x}" aria-label="Quitar uno">−</button>${i.q}<button data-a="p" data-x="${x}" aria-label="Sumar uno">+</button></div></div><b>${ARS(p.p*i.q)}</b></div>`}).join('')}</div><div class="small">${t>=FREE?'Tenés envío gratis.':`Te faltan ${ARS(FREE-t)} para el envío gratis.`}</div><div class="ship"><i style="width:${Math.min(100,t/FREE*100)}%"></i></div><div class="tot"><span>Total</span><span>${ARS(t)}</span></div><button class="cta full" data-a="pay">Ir a pagar</button>`:`<div class="small" style="padding:40px 0;text-align:center">Tu carrito está vacío.<br>Elegí algo del catálogo para empezar.</div>`);
}
$('#drawer').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,x=+b.dataset.x;
  if(a==='close')return closeAll();
  if(a==='p')cart[x].q++;
  if(a==='m'){cart[x].q--;if(cart[x].q<1)cart.splice(x,1)}
  if(a==='back'||a==='p'||a==='m'){save();return drawer()}
  if(a==='pay')return drawer('pay');
  if(a==='confirm'){
    if(!$('#f1').value.trim()||!/\S+@\S+\.\S+/.test($('#f2').value)||!$('#f3').value.trim()){$('#er').textContent='Completá nombre, un email válido y la dirección de envío.';return}
    cart=[];save();drawer('done')}
};
render();$('#count').textContent=cart.reduce((s,i)=>s+i.q,0);
</script>
</body>
